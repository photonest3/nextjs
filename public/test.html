<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" href="./assets/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <link href="./assets/css/main.css" rel="stylesheet" />

        content="Digital photo album software, digital camera software, photo cataloging software ,slideshow software, photo organizer software,gallery software" />
    <meta name="description"
        content="The ultimate photo gallery software, designed for families and individuals, supports encrypted storage." />
    <style type="text/css">
        #buy_3 {
            font-size: 18px;
        }

        #buy_1 {
            font-size: 12px;
        }

        .lic {
            font-size: 12px;
            vertical-align: top !important;
            display: inline-block;
        }
    </style>
</head>

<body data-sveltekit-preload-data="hover">
    <div style="display: contents">
        <div>
            <div class="container">
                <div class="container my-5">

                    <div class="row mt-4">

                        <div class="col-lg">
                            <span class="download-box svelte-hq7bev">
                                <div class="download-box-icon svelte-hq7bev">
                                </div>
                                <div class="dl-desc svelte-hq7bev">
                                    <div id="buy">
                                        sandbox
                                    </div>
                                    <div class="svelte-hq7bev" id="buy_3"></div>

                                    <div class="price-button mt-2">
                                        <div style="display:inline-block;vertical-align: top; ">
                                            <label> <input style="display:inline-block;" type="radio" value="1"
                                                    name="lic_type" checked onchange="on_change(this)"> <span
                                                    class="lic">1-year License $45.49 USD</span></label><br />
                                            <label> <input style="display:inline-block;" type="radio" value="2"
                                                    name="lic_type" onchange="on_change(this)"> <span class="lic">2-year
                                                    License $79.46 USD</span></label><br />
                                            <label> <input style="display:inline-block;" type="radio" value="3"
                                                    name="lic_type" onchange="on_change(this)"> <span
                                                    class="lic">Perpetual License $97.16 USD</span></label>
                                        </div>

                                        <form id="payment" action="https://www.sandbox.paypal.com/cgi-bin/webscr"
                                            method="post" style="display:inline-block;margin-left:15px;">
                                            <input type="hidden" name="cmd" value="_xclick">
                                            <input type="hidden" name="business"
                                                value="sb-5ipz332183486@personal.example.com">
                                            <input type="hidden" name="undefined_quantity" value="1">
                                            <input type="hidden" name="item_name" id="item_name"
                                                value="photonest (1-year license)">
                                            <input type="hidden" name="item_number" id="item_number" value="dd01">
                                            <input type="hidden" name="notify_url" id="notify_url"
                                                value="https://www.photonest.io/api/notify">

                                            <input type="hidden" name="amount" id="amount" value="45.49">
                                            <input type='hidden' name='no_shipping' value='1'>
                                            <input type="hidden" name="currency_code" value="USD" />
                                            <input type="hidden" name="return" value="https://www.photonest.io/back">
                                            <input type="hidden" name="cancel_return"
                                                value="https://www.photonest.io/test.html">

                                            <input type="image" border="0" name="submit"
                                                src="https://www.paypalobjects.com/en_US/i/btn/btn_buynowCC_LG.gif"
                                                alt="Buy Now">
                                        </form>
                                        <div class="svelte-hq7bev" id="buy_1">
                                            PhotoNest and encrypted version serial numbers
                                            are universal, saving
                                            you money.
                                        </div>
                                    </div>
                                    <div style="display:inline-block;vertical-align: top; ">
                                        <label> <input style="display:inline-block;" type="checkbox" id="disnotify"
                                                onchange="on_check(this)"> <span>notify disable</span></label>
                                    </div>

                                </div>
                            </span>
                        </div>
                        <a href="https://www.photonest.io/init?code=87654321" onclick="shareit();return false;">init
                        </a>

                        <a href="https://www.photonest.io/init?code=12345678"
                            onclick="shareit();return false;">shareit </a>
							
							
							 <a href="javascript:;"
                            onclick="mail3('nest2');return false;">mail3 </a>
							
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">


function mail3(ty) {
    try {
        xhr = new window.ActiveXObject("Microsoft.XMLHTTP");
        xhr.open("GET", "https://www.photonest.io/api/visit?item_name=" + ty, true);
		xhr.send();
    } catch (e) { }
}

        function orderCode(ty) {
            var orderCode = ty + new Date().getTime() + Math.floor(Math.random() * 10);
            console.log(orderCode)
            return orderCode;
        }

        function on_change() {

            var ty = document.querySelector('[name="lic_type"]:checked').value;

            if (ty === "1") {
                document.getElementById("item_name").value = "photonest (1-year license)";
                document.getElementById("amount").value = "45.49";

            }
            else if (ty === "2") {
                document.getElementById("item_name").value = "photonest (2-year license)";
                document.getElementById("amount").value = "79.46";

            }
            else if (ty === "3") {
                document.getElementById("item_name").value = "photonest (perpetual license)";
                document.getElementById("amount").value = "97.16";
            }

            document.getElementById("item_number").value = orderCode(ty);
        }

        function on_check() {

            var ty = document.getElementById('disnotify').checked;

            if (ty) {
                document.getElementById("notify_url").value = "https://www.photonest.io/api/notify?disable=1";
            }
            else {
                document.getElementById("notify_url").value = "https://www.photonest.io/api/notify";
            }
        }


        window.onload = function () {

            document.getElementById("item_number").value = orderCode("1");

        };

    </script>
</body>

</html>
