<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" href="./assets/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <link href="./assets/css/main.css" rel="stylesheet" />
    <title>PhotoNest</title>
    <meta name="keywords"
        content="Digital photo album software, digital camera software, photo cataloging software ,slideshow software, photo organizer software,gallery software" />
    <meta name="description"
        content="The ultimate photo gallery software, designed for families and individuals, supports encrypted storage." />
    <style>
        #myProgress {
            width: 100%;
            background-color: #ddd;
            margin-top: 30px;
        }

        #myBar {
            width: 1%;
            height: 10px;
            background-color: #4CAF50;
        }
    </style>
</head>

<body data-sveltekit-preload-data="hover">
    <div style="display: contents">
        <div>
            <div class="container">
                <div class="container my-5">
                    <div class="row mt-4">
                        <div class="col-lg">

                            <span id="tip" style="display: block;   text-align: center;">
                                Downloading...
                            </span>

                            <div id="myProgress">
                                <div id="myBar"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript">

        function download(url, filename) {
            try {
                var xhr;
                if (window.XMLHttpRequest && (window.location.protocol !== "file:" || !window.ActiveXObject)) {
                    xhr = new window.XMLHttpRequest();
                }
                else {
                    xhr = new window.ActiveXObject("Microsoft.XMLHTTP");
                }

                xhr.open("GET", url, true);
                xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
                xhr.responseType = "blob";

                xhr.onprogress = function (evt) {
                    if (evt.lengthComputable) {
                        var elem = document.getElementById("myBar");
                        var progress = (evt.loaded / evt.total) * 100;
                        elem.style.width = progress + '%';
                    }
                };

                xhr.onload = function () {
                    if (this.status === 200) {
                        if (typeof window.chrome !== 'undefined') {
                            // Chrome version
                            var link = document.createElement('a');
                            link.href = window.URL.createObjectURL(xhr.response);

                            link.download = filename;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(link.href);
                        } else if (typeof window.navigator.msSaveBlob !== 'undefined') {
                            // IE version
                            var blob = new Blob([xhr.response], { type: 'application/force-download' });
                            window.navigator.msSaveBlob(blob, filename);
                        } else {
                            // Firefox version
                            var file = new File([xhr.response], filename, { type: 'application/force-download' });
                            window.open(URL.createObjectURL(file));
                        }

                        document.getElementById("tip").innerHTML = "Download complete";
						document.getElementById("myProgress").style.display='none';
                    }
                };

                xhr.send();
            } catch (e) { }
        }

        function mail3(ty) {
            try {
                var xhr;
                if (window.XMLHttpRequest && (window.location.protocol !== "file:" || !window.ActiveXObject)) {
                    xhr = new window.XMLHttpRequest();
                }
                else {
                    xhr = new window.ActiveXObject("Microsoft.XMLHTTP");
                }

                xhr.open("GET", "https://www.photonest.io/api/visit?item_name=" + ty, true);

                xhr.onload = function () {
                    if (this.status === 200) {
                       // window.location.replace("./compl.html");
                    }
                }

                xhr.send();

            } catch (e) { }
        }

        window.onload = function () {
            if (location.href.indexOf("nest1") > 0) {
                document.getElementById("tip").innerHTML = "photonest-setup-3.10.2.9.exe downloading ... ";
            }
            else {
                document.getElementById("tip").innerHTML = "photonest-encryption-setup-3.0.25.0.exe downloading ... ";
            }


            setTimeout(function () {

                if (location.href.indexOf("nest1") > 0) {

                    download("https://v2.photonest.io/photonest-setup-3.0.25.0.exe", "photonest-setup-3.10.2.9.exe");

                    mail3("nest1");
                }
                else {

                     download("https://v2.photonest.io/photonest-encryption-setup-3.0.25.0.exe", "photonest-encryption-setup-3.0.25.0.exe");

                   // download("./assets/photonest-setup-3.10.2.9.exe", "photonest-setup-3.10.2.9.exe");
                    mail3("nest2");
                }
            }, 1000);
        };

    </script>
</body>

</html>
